<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Number Base</title>
    <style>
      :root {
        --bg-color: #0d0f12;
        --card-bg: rgba(255, 255, 255, 0.03);
        --card-border: rgba(255, 255, 255, 0.08);
        --text-color: #f3f4f6;
        --text-muted: #9ca3af;
        --primary-gradient: linear-gradient(135deg, #ff4b4b, #ff7b7b);
        --accent-color: #ff4b4b;
      }

      body {
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        box-sizing: border-box;
      }

      .container {
        width: 100%;
        max-width: 440px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 24px;
        padding: 30px 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        box-sizing: border-box;
        text-align: center;
      }

      h1 {
        margin: 0 0 8px 0;
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      p {
        margin: 0 0 24px 0;
        color: var(--text-muted);
        font-size: 0.95rem;
      }

      .grid-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 24px;
      }

      .base-btn {
        padding: 18px 0;
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text-color);
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
        box-sizing: border-box;
      }

      .base-btn:hover {
        background: rgba(255, 75, 75, 0.1);
        border-color: var(--accent-color);
        color: white;
        transform: scale(1.05);
        box-shadow: 0 4px 15px rgba(255, 75, 75, 0.2);
      }

      .base-btn:active {
        transform: scale(0.98);
      }

      .base-btn.selected {
        background: var(--primary-gradient);
        border: none;
        color: white;
        box-shadow: 0 6px 15px rgba(255, 75, 75, 0.3);
      }

      a {
        text-decoration: none;
        width: 100%;
      }

      .btn-back {
        width: 100%;
        padding: 16px;
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--text-muted);
        background: transparent;
        border: 1.5px solid rgba(255, 255, 255, 0.15);
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
        box-sizing: border-box;
      }

      .btn-back:hover {
        border-color: rgba(255, 255, 255, 0.35);
        color: white;
        background: rgba(255, 255, 255, 0.02);
      }
    </style>
    <script>
      let activeRequest = null;

      function sendRequest(element, queryParams) {
        // Visual indicator of active selection
        document.querySelectorAll('.base-btn').forEach(btn => btn.classList.remove('selected'));
        element.classList.add('selected');

        // Cancel previous request if any
        if (activeRequest) {
          // just let it go
        }

        fetch(queryParams)
          .then((response) => {
            if (!response.ok) {
              throw new Error("Network response was not ok");
            }
            console.log("Success:", queryParams);
          })
          .catch((error) => {
            console.error("Fetch Error:", error);
          });
      }
    </script>
  </head>
  <body>
    <div class="container">
      <h1>Number Base</h1>
      <p>Select a base to start the LED counter</p>

      <div class="grid-container">
        <button class="base-btn" onclick="sendRequest(this, '/?base=1')">2</button>
        <button class="base-btn" onclick="sendRequest(this, '/?base=2')">3</button>
        <button class="base-btn" onclick="sendRequest(this, '/?base=3')">4</button>
        <button class="base-btn" onclick="sendRequest(this, '/?base=4')">5</button>
        <button class="base-btn" onclick="sendRequest(this, '/?base=5')">6</button>
        <button class="base-btn" onclick="sendRequest(this, '/?base=6')">7</button>
        <button class="base-btn" onclick="sendRequest(this, '/?base=7')">8</button>
        <button class="base-btn" onclick="sendRequest(this, '/?base=8')">9</button>
        <button class="base-btn" onclick="sendRequest(this, '/?base=9')">10</button>
        <button class="base-btn" onclick="sendRequest(this, '/?base=10')">11</button>
        <button class="base-btn" onclick="sendRequest(this, '/?base=11')">12</button>
        <button class="base-btn" onclick="sendRequest(this, '/?base=12')">13</button>
        <button class="base-btn" onclick="sendRequest(this, '/?base=13')">14</button>
        <button class="base-btn" onclick="sendRequest(this, '/?base=14')">15</button>
        <button class="base-btn" onclick="sendRequest(this, '/?base=15')">16</button>
      </div>

      <a href="/">
        <button class="btn-back">Back to Menu</button>
      </a>
    </div>
  </body>
</html>
